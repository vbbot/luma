name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint and build debug APK
        run: ./gradlew ktlintCheck assembleDebug

      - name: Name APK
        run: |
          version=$(sed -n 's/^\s*versionName\s*"\([^"]\+\)".*/\1/p' app/build.gradle | head -n1)
          echo "APK_NAME=luma_debug_${version}_${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          mv app/build/outputs/apk/debug/app-debug.apk "luma_debug_${version}_${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}.apk
